AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  NOVA Angular frontend: private S3 REST origin, OAC and HTTPS CloudFront.
  Standard usage-based distribution; no flat-rate subscription, WAF, domain
  registration or account plan change. AWS usage can consume account credits.

# Publish only dist/frontend/browser, never source files, credentials or .env.
# index.html: Cache-Control: no-cache,max-age=0,must-revalidate
# Hashed JS/CSS: Cache-Control: public,max-age=31536000,immutable
# Other assets: choose a short max-age unless their names are content-hashed.
# Invalidate /* after publication. Configure the exact FrontendOrigin output
# in the separate backend's CORS_ORIGINS before testing authentication.

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Application
          Value: NOVA
        - Key: Component
          Value: Frontend

  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Join ['-', ['nova-s3', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
        Description: Signed access to the private NOVA frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Join ['-', ['nova-cache', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
        Comment: Respect S3 Cache-Control; do not cache HTML without freshness metadata
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Join ['-', ['nova-spa', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite only existing Angular routes; retain missing asset and route errors
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.length > 1 && uri.charAt(uri.length - 1) === '/') {
            uri = uri.slice(0, -1);
          }
          var routes = ['/', '/login', '/register', '/profile', '/reservations'];
          if ((request.method === 'GET' || request.method === 'HEAD') &&
              routes.indexOf(uri) !== -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub 'NOVA frontend - ${AWS::StackName}'
        Enabled: true
        PriceClass: PriceClass_100
        HttpVersion: http2
        IPV6Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: NovaFrontendS3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOac
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: NovaFrontendS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref FrontendCachePolicy
          # AWS managed SecurityHeadersPolicy; API CORS belongs on the backend.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionMetadata.FunctionARN
        # Keep origin error status codes. Never convert missing JS/CSS to HTML/200.
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadObjects
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
          # S3 returns 404 for absent objects only when the signed caller also
          # has ListBucket. This is restricted to this distribution, not public.
          # Root requests become index.html; the cache policy drops query strings.
          - Sid: AllowCloudFrontMissingObjectStatus
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt FrontendBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub '${FrontendBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  BucketName:
    Description: Private bucket for the contents of dist/frontend/browser
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront distribution used for invalidation after publication
    Value: !Ref FrontendDistribution
  CloudFrontDomain:
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendOrigin:
    Description: Exact origin to allow in the separate backend CORS_ORIGINS
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}/'
